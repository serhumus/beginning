<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ultimate Multi-API Crypto Monitor</title>
    <style>
        body { font-family: 'Inter', -apple-system, sans-serif; background: #0f172a; color: #f1f5f9; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .card { background: #1e293b; padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 100%; max-width: 550px; border: 1px solid #334155; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .input-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-size: 0.85rem; font-weight: 600; color: #94a3b8; }
        input, select, button { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #334155; background: #0f172a; color: white; box-sizing: border-box; font-size: 14px; }
        button { background: #3b82f6; border: none; cursor: pointer; font-weight: bold; margin-top: 10px; transition: 0.2s; }
        button:hover { background: #2563eb; }
        #status-box { margin-top: 20px; padding: 20px; border-radius: 12px; background: #0f172a; text-align: center; border: 1px solid #334155; }
        .price-display { font-size: 2.5rem; font-weight: 800; color: #10b981; margin: 10px 0; }
        .up { color: #10b981; } .down { color: #ef4444; }
        small { color: #64748b; display: block; margin-top: 5px; }
    </style>
</head>
<body>

<div class="card">
    <h2 style="margin-top:0">📡 Global Price Monitor</h2>
    
    <div class="input-group">
        <label>API Data Source</label>
        <select id="apiSource" onchange="updatePlaceholder()">
			<option value="coinbase">Coinbase (Pair: BTC-USD)</option>
            <option value="coingecko">CoinGecko (ID: bitcoin, ethereum)</option>
            <option value="binance">Binance (Pair: BTCUSDT, ETHUSDT)</option>
            <option value="kraken">Kraken (Pair: XBTUSD, ETHUSD)</option>
            <option value="kucoin">KuCoin (Pair: BTC-USDT)</option>
            <option value="coinpaprika">Coinpaprika (ID: btc-bitcoin)</option>
            <option value="bitfinex">Bitfinex (Pair: tBTCUSD)</option>
        </select>
    </div>

    <div class="grid">
        <div class="input-group">
            <label id="coinLabel">Coin ID / Symbol</label>
            <input type="text" id="coinId" value="RAVE-USD">
        </div>
        <div class="input-group">
            <label id="coinLabel">Name to Speak</label>
            <input type="text" id="NameCoin" value="Rave">
        </div>
        <div class="input-group">
            <label>Interval (Seconds)</label>
            <input type="number" id="interval" value="7" min="5">
        </div>
    </div>

    <div class="input-group">
        <label>Threshold Alert (%)</label>
        <input type="number" id="threshold" value="1" step="0.01">
    </div>

    <div style="background: #334155; height: 1px; margin: 20px 0;"></div>

    <div class="grid">
        <div class="input-group">
            <label>Voice Selection</label>
            <select id="voiceList"></select>
        </div>
        <div class="input-group">
            <label>Speed & Pitch</label>
            <div style="display:flex; gap: 5px;">
                <input type="range" id="voiceRate" min="0.5" max="2" step="0.1" value="1" title="Speed">
                <input type="range" id="voicePitch" min="0" max="2" step="0.1" value="1" title="Pitch">
            </div>
        </div>
    </div>

    <button id="startBtn">Start Monitoring</button>
    
    <div id="status-box">
        <div id="sourceIndicator" style="font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px;">Ready</div>
        <div class="price-display" id="currentPrice">$--</div>
        <div id="lastChange">Enter a coin and press start</div>
    </div>
</div>

<script>
    let lastPrice = null;
    let monitorInterval = null;
    const synth = window.speechSynthesis;

    // Mapping for different API formats
    const apiConfigs = {
        coingecko: {
            url: (id) => `https://api.coingecko.com/api/v3/simple/price?ids=${id}&vs_currencies=usd`,
            parse: (data, id) => data[id.toLowerCase()].usd
        },
        binance: {
            url: (id) => `https://api.binance.com/api/v3/ticker/price?symbol=${id.toUpperCase()}`,
            parse: (data) => parseFloat(data.price)
        },
        kraken: {
            url: (id) => `https://api.kraken.com/0/public/Ticker?pair=${id.toUpperCase()}`,
            parse: (data) => {
                const pair = Object.keys(data.result)[0];
                return parseFloat(data.result[pair].a[0]);
            }
        },
        kucoin: {
            url: (id) => `https://api.kucoin.com/api/v1/market/orderbook/level1?symbol=${id.toUpperCase()}`,
            parse: (data) => parseFloat(data.data.price)
        },
        coinpaprika: {
            url: (id) => `https://api.coinpaprika.com/v1/tickers/${id.toLowerCase()}`,
            parse: (data) => data.quotes.USD.price
        },
        bitfinex: {
            url: (id) => `https://api-pub.bitfinex.com/v2/ticker/${id.toUpperCase()}`,
            parse: (data) => data[6] // Last price is index 6 in Bitfinex v2 array
        },
        coinbase: {
            url: (id) => `https://api.coinbase.com/v2/prices/${id.toUpperCase()}/spot`,
            parse: (data) => parseFloat(data.data.amount)
        }
    };

    function updatePlaceholder() {
        const source = document.getElementById('apiSource').value;
        const input = document.getElementById('coinId');
        const hints = {
            coingecko: "bitcoin",
            binance: "BTCUSDT",
            kraken: "XBTUSD",
            kucoin: "BTC-USDT",
            coinpaprika: "btc-bitcoin",
            bitfinex: "tBTCUSD",
            coinbase: "BTC-USD"
        };
        input.value = hints[source];
    }

    function populateVoices() {
        const voices = synth.getVoices();
        const list = document.getElementById('voiceList');
        list.innerHTML = voices.map(v => `<option value="${v.name}">${v.name}</option>`).join('');
    }

    if (speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = populateVoices;
    populateVoices();

    async function fetchPrice() {
        const sourceKey = document.getElementById('apiSource').value;
        const coinId = document.getElementById('coinId').value;
        const config = apiConfigs[sourceKey];
        
        try {
            const response = await fetch(config.url(coinId));
            if (!response.ok) throw new Error("API Response Error");
            const data = await response.json();
            const price = config.parse(data, coinId);
            
            processPriceUpdate(price);
        } catch (err) {
            document.getElementById('lastChange').textContent = "⚠️ Check ID/Symbol for this API";
            console.error(err);
        }
    }

    function processPriceUpdate(price) {
        const priceEl = document.getElementById('currentPrice');
        priceEl.textContent = `$${price.toLocaleString(undefined, {minimumFractionDigits: 4})}`;
        const coinId = document.getElementById('coinId').value;
        const nameCoin = document.getElementById('NameCoin').value;
        if (lastPrice !== null) {
            const percentChange = ((price - lastPrice) / lastPrice) * 100;
            const threshold = parseFloat(document.getElementById('threshold').value);

            if (Math.abs(percentChange) >= threshold) {
                const direction = percentChange > 0 ? "surpassed" : "dropped";
                //const msg = `The price of ${coinId} ${direction} ${Math.abs(percentChange).toFixed(2)} percent.`;
                const msg = `${nameCoin} ${direction}`;
                speak(msg);
                document.getElementById('lastChange').innerHTML = `<span class="${percentChange > 0 ? 'up' : 'down'}">${msg}</span>`;
            } else {
                document.getElementById('lastChange').textContent = `Change: ${percentChange.toFixed(3)}%`;
            }
        }
        lastPrice = price;
    }

    function speak(text) {
        synth.cancel();
        const utter = new SpeechSynthesisUtterance(text);
        utter.voice = synth.getVoices().find(v => v.name === document.getElementById('voiceList').value);
        utter.rate = document.getElementById('voiceRate').value;
        utter.pitch = document.getElementById('voicePitch').value;
        synth.speak(utter);
    }

    document.getElementById('startBtn').addEventListener('click', function() {
        if (monitorInterval) {
            clearInterval(monitorInterval);
            monitorInterval = null;
            this.textContent = "Start Monitoring";
            this.style.background = "#3b82f6";
        } else {
            lastPrice = null;
            fetchPrice();
            const ms = parseInt(document.getElementById('interval').value) * 1000;
            monitorInterval = setInterval(fetchPrice, ms);
            this.textContent = "Stop Monitoring";
            this.style.background = "#ef4444";
        }
    });
    


</script>
</body>
</html>
